<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, CACHE_SIZE_UNLIMITED, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCruGWPLm2EqsHEq-IsAyg0MdbCewUEAWs",
    authDomain: "tareas-sanjacinto-898d1.firebaseapp.com",
    projectId: "tareas-sanjacinto-898d1",
    storageBucket: "tareas-sanjacinto-898d1.firebasestorage.app",
    messagingSenderId: "213891706495",
    appId: "1:213891706495:web:46a04222577848da37d94a"
  };

  const app = initializeApp(firebaseConfig);
  // Persistencia offline: cache local en IndexedDB con soporte multi-tab
  let db;
  try {
    db = initializeFirestore(app, {
      localCache: persistentLocalCache({
        tabManager: persistentMultipleTabManager(),
        cacheSizeBytes: CACHE_SIZE_UNLIMITED
      })
    });
  } catch (e) {
    console.warn('Persistencia multi-tab no disponible, usando fallback:', e);
    db = initializeFirestore(app, {
      localCache: persistentLocalCache({ cacheSizeBytes: CACHE_SIZE_UNLIMITED })
    });
  }
  const tasksCol = collection(db, 'tareas');

  // Expose DB functions to global scope
  window._db = db;
  window._tasksCol = tasksCol;
  window._firestoreFns = { getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy };

  // Start listening once DOM ready
  window.addEventListener('load', () => {
    if (window.initFirestore) window.initFirestore();
  });
</script>
<style>
:root {
  --red: #a6192e;
  --red-dark: #7a1020;
  --red-pale: #f9eaec;
  --red-mid: #c0392b;
  --black: #111111;
  --gray-dk: #3a3a3a;
  --gray-md: #777777;
  --gray-lt: #d0d0d0;
  --gray-pl: #f5f5f3;
  --white: #ffffff;
  --serif: 'Roboto Slab', 'Rockwell', Georgia, serif;
  --sans: 'Barlow', 'Gotham', system-ui, sans-serif;
  --radius: 4px;
  --radius-lg: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--gray-pl);
  color: var(--black);
  min-height: 100vh;
  font-size: 15px;
}

/* ── HEADER ── */
.header {
  background: var(--white);
  border-bottom: 3px solid var(--red);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  height: 64px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 600;
  color: var(--black);
  letter-spacing: 0.01em;
}

.header-subtitle {
  font-size: 12px;
  color: var(--gray-md);
  font-weight: 400;
  margin-left: auto;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ── LAYOUT ── */
.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

/* ── INPUT CARD ── */
.input-card {
  background: var(--white);
  border: 1px solid var(--gray-lt);
  border-top: 3px solid var(--red);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.input-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gray-md);
  margin-bottom: 0.75rem;
  display: block;
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

textarea {
  flex: 1;
  border: 1px solid var(--gray-lt);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 14px;
  font-family: var(--sans);
  color: var(--black);
  background: var(--gray-pl);
  min-height: 72px;
  resize: none;
  line-height: 1.55;
  transition: border-color 0.15s;
}

textarea:focus {
  outline: none;
  border-color: var(--red);
  background: var(--white);
}

textarea::placeholder { color: var(--gray-md); }

.btn-mic {
  background: var(--white);
  border: 1px solid var(--gray-lt);
  border-radius: var(--radius);
  width: 44px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--gray-md);
  flex-shrink: 0;
  transition: all 0.15s;
}
.btn-mic:hover { border-color: var(--red); color: var(--red); }
.btn-mic.recording {
  background: var(--red-pale);
  border-color: var(--red);
  color: var(--red);
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(166,25,46,0.3); }
  50% { box-shadow: 0 0 0 6px rgba(166,25,46,0); }
}

.btn-parse {
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: var(--radius);
  padding: 0 18px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  height: 72px;
  min-width: 110px;
  letter-spacing: 0.03em;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s;
}

.btn-parse:hover { background: var(--red-dark); }
.btn-parse:disabled { opacity: 0.55; cursor: not-allowed; }

.btn-parse svg { width: 18px; height: 18px; }

.hint {
  font-size: 12px;
  color: var(--gray-md);
  margin-top: 8px;
}

/* ── PREVIEW FORM ── */
.preview-form {
  display: none;
  margin-top: 1.25rem;
  border-top: 1px solid var(--gray-lt);
  padding-top: 1.25rem;
}

.preview-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--red);
  margin-bottom: 1rem;
}

.fields-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 1rem;
}

.field-full { grid-column: 1 / -1; }

.field-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field-group label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gray-md);
}

.field-group input,
.field-group select {
  border: 1px solid var(--gray-lt);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--sans);
  color: var(--black);
  background: var(--gray-pl);
  transition: border-color 0.15s;
}

.field-group input:focus,
.field-group select:focus {
  outline: none;
  border-color: var(--red);
  background: var(--white);
}

.preview-actions {
  display: flex;
  gap: 8px;
}

.btn-confirm {
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: var(--radius);
  padding: 9px 20px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  letter-spacing: 0.03em;
  transition: background 0.15s;
}

.btn-confirm:hover { background: var(--red-dark); }

.btn-cancel {
  background: transparent;
  color: var(--gray-md);
  border: 1px solid var(--gray-lt);
  border-radius: var(--radius);
  padding: 9px 16px;
  font-size: 13px;
  font-family: var(--sans);
  cursor: pointer;
  transition: color 0.15s;
}

.btn-cancel:hover { color: var(--gray-dk); }

/* ── FILTERS ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

.filter-pill {
  background: var(--white);
  border: 1px solid var(--gray-lt);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--gray-dk);
  cursor: pointer;
  transition: all 0.12s;
  font-family: var(--sans);
}

.filter-pill:hover { border-color: var(--red); color: var(--red); }

.filter-pill.active {
  background: var(--red);
  border-color: var(--red);
  color: var(--white);
}

.proj-filter {
  margin-left: auto;
  font-size: 12px;
  color: var(--gray-md);
  cursor: pointer;
  font-weight: 500;
  transition: color 0.12s;
}

.proj-filter:hover { color: var(--red); }

/* ── TASK LIST ── */
.tasks-meta {
  font-size: 12px;
  color: var(--gray-md);
  margin-bottom: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.task-list { display: flex; flex-direction: column; gap: 5px; }

.section-divider {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gray-md);
  margin: 1.25rem 0 0.6rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--gray-lt);
}

/* ── TASK CARD ── */
.task-card {
  background: var(--white);
  border: 1px solid var(--gray-lt);
  border-left: 3px solid transparent;
  border-radius: var(--radius-lg);
  padding: 0.875rem 1rem;
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 10px;
  align-items: start;
  transition: border-color 0.12s, box-shadow 0.12s;
}

.task-card:hover {
  border-left-color: var(--red);
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}

.task-card.done {
  opacity: 0.45;
  border-left-color: var(--gray-lt) !important;
}

.task-card.done .task-title { text-decoration: line-through; }

.task-card.prio-alta { border-left-color: var(--red); }

/* ── CHECKBOX ── */
.check-wrap {
  padding-top: 2px;
}

.check-btn {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--gray-lt);
  background: transparent;
  cursor: pointer;
  position: relative;
  transition: border-color 0.12s, background 0.12s;
  flex-shrink: 0;
  display: block;
}

.check-btn:hover { border-color: var(--red); }

.check-btn.done {
  background: var(--red);
  border-color: var(--red);
}

.check-btn.done::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 5px;
  border-left: 1.5px solid var(--white);
  border-bottom: 1.5px solid var(--white);
  transform: rotate(-45deg);
  top: 4px;
  left: 3px;
}

/* ── TASK CONTENT ── */
.task-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--black);
  margin-bottom: 5px;
  line-height: 1.4;
}

.task-meta {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

.badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.badge-project {
  background: #111111;
  color: var(--white);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.badge-due {
  background: var(--gray-pl);
  color: var(--gray-dk);
  border: 1px solid var(--gray-lt);
}

.badge-due.overdue {
  background: var(--red-pale);
  color: var(--red);
  border-color: #f0b8bf;
}

.badge-due.today {
  background: #fff8e6;
  color: #8a6200;
  border-color: #f0d88a;
}

.badge-alta {
  background: var(--red-pale);
  color: var(--red);
  border: 1px solid #f0b8bf;
}

.badge-baja {
  background: #eaf3de;
  color: #3b6d11;
  border: 1px solid #c0dd97;
}

.task-del {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--gray-lt);
  padding: 3px;
  border-radius: var(--radius);
  transition: color 0.12s;
  display: flex;
  align-items: center;
}

.task-del:hover { color: var(--red); }

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--gray-md);
}

.empty-icon {
  width: 48px;
  height: 48px;
  background: var(--gray-pl);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1rem;
}

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 2rem 0 1rem;
  font-size: 11px;
  color: var(--gray-lt);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ── SPINNER ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin 0.8s linear infinite; display: inline-block; }
</style>
</head>

  <div class="header-title" style="margin-left:1.25rem;padding-left:1.25rem;border-left:1px solid var(--gray-lt);">Tareas</div>
  <div class="header-subtitle">Organizador de proyectos</div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
    <button id="installBtn" onclick="installApp()" style="display:none;background:var(--white);border:1px solid var(--red);color:var(--red);border-radius:4px;padding:5px 12px;font-size:11px;font-weight:600;font-family:var(--sans);cursor:pointer;letter-spacing:0.03em;text-transform:uppercase;">Instalar app</button>
    <div id="syncStatus" style="font-size:11px;color:#888;font-weight:500;white-space:nowrap;">● Conectando...</div>
  </div>
</header>

<div class="container">

  <div class="input-card">
    <span class="input-label">Nueva tarea</span>
    <div class="input-row">
      <textarea id="rawInput" placeholder="Escribí, pegá texto de WhatsApp, o usá el micrófono&#10;Ej: llamar a Tarik el viernes sobre el rack NIREA, urgente"></textarea>
      <button class="btn-mic" id="micBtn" onclick="toggleMic()" title="Dictar tarea">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="btn-parse" id="parseBtn" onclick="parseTarea()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/><path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75L19 15z"/></svg>
        Interpretar
      </button>
    </div>
    <p class="hint">La IA reescribe como acción concreta y asigna proyecto automáticamente</p>

    <div class="preview-form" id="previewForm">
      <div class="preview-label">Revisá y editá si hace falta</div>
      <div class="fields-grid">
        <div class="field-group field-full">
          <label>Acción</label>
          <input type="text" id="pTitle" />
        </div>
        <div class="field-group">
          <label>Proyecto</label>
          <input type="text" id="pProject" list="projectsList" />
          <datalist id="projectsList"></datalist>
        </div>
        <div class="field-group">
          <label>Fecha límite</label>
          <input type="date" id="pDue" />
        </div>
        <div class="field-group">
          <label>Prioridad</label>
          <select id="pPriority">
            <option value="media">Media</option>
            <option value="alta">Alta</option>
            <option value="baja">Baja</option>
          </select>
        </div>
      </div>
      <div class="preview-actions">
        <button class="btn-confirm" onclick="confirmTask()">Agregar tarea</button>
        <button class="btn-cancel" onclick="cancelPreview()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="filter-pill active" onclick="setFilter('todas', this)">Todas</button>
    <button class="filter-pill" onclick="setFilter('pendientes', this)">Pendientes</button>
    <button class="filter-pill" onclick="setFilter('hoy', this)">Hoy</button>
    <button class="filter-pill" onclick="setFilter('vencidas', this)">Vencidas</button>
    <span class="proj-filter" onclick="cycleProjectFilter()" id="projFilterLabel">Todos los proyectos ▾</span>
  </div>

  <div id="taskContainer"></div>

  <div class="footer">Frigorífico San Jacinto · Nirea S.A. · Uruguay</div>
</div>

<script>
let tasks = [];
let currentFilter = 'todas';
let projectFilter = null;

// ── FIRESTORE SYNC ──
window.initFirestore = function() {
  const { onSnapshot, query, orderBy } = window._firestoreFns;
  const q = query(window._tasksCol, orderBy('created', 'desc'));
  onSnapshot(q, (snapshot) => {
    tasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTasks();
    const el = document.getElementById('syncStatus');
    if (el) {
      if (navigator.onLine) { el.textContent = '● Sincronizado'; el.style.color = '#3b6d11'; }
      else { el.textContent = '● Offline (datos locales)'; el.style.color = '#b15c00'; }
    }
  }, (err) => {
    console.error('Firestore error:', err);
    const el = document.getElementById('syncStatus');
    if (el) {
      if (!navigator.onLine) { el.textContent = '● Offline (datos locales)'; el.style.color = '#b15c00'; }
      else { el.textContent = '● Sin conexión'; el.style.color = '#993C1D'; }
    }
  });
};

async function saveTask(task) {
  const { addDoc } = window._firestoreFns;
  const { id, ...data } = task;
  await addDoc(window._tasksCol, data);
}

async function updateTask(id, changes) {
  const { updateDoc, doc } = window._firestoreFns;
  await updateDoc(doc(window._db, 'tareas', id), changes);
}

async function removeTask(id) {
  const { deleteDoc, doc } = window._firestoreFns;
  await deleteDoc(doc(window._db, 'tareas', id));
}

async function parseTarea() {
  const raw = document.getElementById('rawInput').value.trim();
  if (!raw) return;

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinning">⟳</span> Interpretando...';
  document.getElementById('previewForm').style.display = 'none';

  const today = new Date().toISOString().split('T')[0];
  const dayName = new Date().toLocaleDateString('es-UY', { weekday: 'long' });
  const projects = [...new Set(tasks.map(t => t.project).filter(Boolean))];

  const _now = new Date();
  const _dow = _now.getDay();
  const _dToFri = ((_dow <= 5) ? (5 - _dow) || 7 : 6);
  const _fri = new Date(_now); _fri.setDate(_now.getDate() + _dToFri);
  const _friStr = _fri.toISOString().split('T')[0];
  const _tom = new Date(_now); _tom.setDate(_now.getDate() + 1);
  const _tomStr = _tom.toISOString().split('T')[0];
  const _in7 = new Date(_now); _in7.setDate(_now.getDate() + 7);
  const _in7Str = _in7.toISOString().split('T')[0];
  const _in14 = new Date(_now); _in14.setDate(_now.getDate() + 14);
  const _in14Str = _in14.toISOString().split('T')[0];

  const systemPrompt = `Sos un asistente que convierte texto informal en tareas ejecutables.
Hoy es ${dayName} ${today}. Manana: ${_tomStr}. Viernes de esta semana: ${_friStr}.
Proyectos existentes: ${projects.length ? projects.map(p => '"'+p+'"').join(', ') : 'ninguno aun'}.

TODOS los campos son OBLIGATORIOS. No uses null salvo que sea imposible inferir.

1. title: SIEMPRE reescribi como accion ejecutable. Verbo infinitivo + objeto + contexto minimo. Max 7 palabras. NUNCA copies el texto original literalmente. Buenos ejemplos: "Llamar a Tarik sobre motor rack NIREA", "Revisar modelo margen pata bovina", "Enviar informe condensado a gerencia".

2. project: SIEMPRE asigna uno. Usa el existente con mejor match semantico aunque sea parcial. Si no hay match, crea uno nuevo coherente con el contexto (ej: "NIREA Rack", "Produccion", "Personal", "San Jacinto"). Solo null si el texto es absolutamente ininterpretable.

3. due: SIEMPRE pon una fecha YYYY-MM-DD:
   - urgente / hoy / ya / lo antes posible → ${today}
   - manana → ${_tomStr}
   - esta semana / resolver pronto / sin fecha explicita + urgente → ${_friStr}
   - el viernes → ${_friStr}
   - sin referencia temporal + prioridad alta → ${_friStr}
   - sin referencia temporal + prioridad media → ${_in7Str}
   - sin referencia temporal + prioridad baja → ${_in14Str}

4. priority: alta si dice urgente/hoy/manana/esta semana/importante/ya. baja si dice cuando pueda/sin apuro/algun dia. media en el resto.

Responde SOLO con JSON valido sin markdown ni texto extra:
{"title":"...","project":"...","due":"YYYY-MM-DD","priority":"alta|media|baja"}`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        system: systemPrompt,
        messages: [{ role: 'user', content: raw }]
      })
    });
    const data = await resp.json();
    const text = data.content.filter(c => c.type === 'text').map(c => c.text).join('');
    const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());

    document.getElementById('pTitle').value = parsed.title || raw;
    document.getElementById('pProject').value = parsed.project || '';
    document.getElementById('pDue').value = parsed.due || '';
    document.getElementById('pPriority').value = parsed.priority || 'media';
    document.getElementById('projectsList').innerHTML = projects.map(p => `<option value="${p}">`).join('');
  } catch(e) {
    document.getElementById('pTitle').value = raw;
    document.getElementById('pProject').value = '';
    document.getElementById('pDue').value = '';
    document.getElementById('pPriority').value = 'media';
  }

  document.getElementById('previewForm').style.display = 'block';
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/><path d="M19 15l.75 2.25L22 18l-2.25.75L19 21l-.75-2.25L16 18l2.25-.75L19 15z"/></svg>Interpretar';
}

async function confirmTask() {
  const task = {
    title: document.getElementById('pTitle').value.trim(),
    project: document.getElementById('pProject').value.trim() || null,
    due: document.getElementById('pDue').value || null,
    priority: document.getElementById('pPriority').value,
    done: false,
    created: new Date().toISOString()
  };
  if (!task.title) return;
  await saveTask(task);
  document.getElementById('rawInput').value = '';
  document.getElementById('previewForm').style.display = 'none';
}

function cancelPreview() {
  document.getElementById('previewForm').style.display = 'none';
}

async function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (t) await updateTask(id, { done: !t.done });
}

async function deleteTask(id) {
  await removeTask(id);
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function cycleProjectFilter() {
  const projects = [...new Set(tasks.map(t => t.project).filter(Boolean))];
  if (!projects.length) return;
  const opts = [null, ...projects];
  const idx = opts.indexOf(projectFilter);
  projectFilter = opts[(idx + 1) % opts.length];
  document.getElementById('projFilterLabel').textContent = (projectFilter || 'Todos los proyectos') + ' ▾';
  renderTasks();
}

function formatDue(due) {
  if (!due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due + 'T00:00:00');
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { label: 'Vencida', cls: 'overdue' };
  if (diff === 0) return { label: 'Hoy', cls: 'today' };
  if (diff === 1) return { label: 'Mañana', cls: '' };
  return { label: d.toLocaleDateString('es-UY', { day: 'numeric', month: 'short' }), cls: '' };
}

function isToday(due) {
  if (!due) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(due + 'T00:00:00').getTime() === today.getTime();
}

function isOverdue(due, done) {
  if (!due || done) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(due + 'T00:00:00') < today;
}

function renderTasks() {
  let filtered = tasks.filter(t => {
    if (projectFilter && t.project !== projectFilter) return false;
    if (currentFilter === 'pendientes') return !t.done;
    if (currentFilter === 'hoy') return isToday(t.due) && !t.done;
    if (currentFilter === 'vencidas') return isOverdue(t.due, t.done);
    return true;
  });

  const container = document.getElementById('taskContainer');
  if (!filtered.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d0d0d0" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>Sin tareas para mostrar</div>`;
    return;
  }

  const pending = filtered.filter(t => !t.done);
  const done = filtered.filter(t => t.done);
  let html = `<div class="tasks-meta">${filtered.length} tarea${filtered.length !== 1 ? 's' : ''}</div>`;
  if (pending.length) html += renderGroup(pending);
  if (done.length) html += `<div class="section-divider">Completadas</div>` + renderGroup(done);
  container.innerHTML = html;
}

function renderGroup(list) {
  return `<div class="task-list">` + list.map(t => {
    const due = formatDue(t.due);
    const prioClass = t.priority === 'alta' ? 'prio-alta' : '';
    return `<div class="task-card ${t.done ? 'done' : ''} ${prioClass}">
      <div class="check-wrap">
        <button class="check-btn ${t.done ? 'done' : ''}" onclick="toggleDone('${t.id}')" aria-label="${t.done ? 'Marcar pendiente' : 'Marcar hecha'}"></button>
      </div>
      <div>
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          ${t.project ? `<span class="badge badge-project">${t.project}</span>` : ''}
          ${due ? `<span class="badge badge-due ${due.cls}">${due.label}</span>` : ''}
          ${t.priority === 'alta' ? `<span class="badge badge-alta">Urgente</span>` : ''}
          ${t.priority === 'baja' ? `<span class="badge badge-baja">Sin apuro</span>` : ''}
        </div>
      </div>
      <button class="task-del" onclick="deleteTask('${t.id}')" aria-label="Eliminar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </div>`;
  }).join('') + `</div>`;
}


// ── VOICE INPUT ──
let recognition = null;
let isRecording = false;

function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Tu navegador no soporta reconocimiento de voz. Usá Chrome o Edge.');
    return;
  }

  if (isRecording) {
    recognition.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'es-UY';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('rawInput').placeholder = 'Escuchando...';
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('rawInput').value = transcript;
    if (e.results[e.results.length - 1].isFinal) {
      stopMic();
      // Auto-interpret after voice input
      setTimeout(() => parseTarea(), 300);
    }
  };

  recognition.onerror = (e) => {
    console.error('Speech error:', e.error);
    stopMic();
  };

  recognition.onend = () => stopMic();

  recognition.start();
}

function stopMic() {
  isRecording = false;
  const btn = document.getElementById('micBtn');
  if (btn) btn.classList.remove('recording');
  const ta = document.getElementById('rawInput');
  if (ta && !ta.value) ta.placeholder = 'Escribí, pegá texto de WhatsApp, o usá el micrófono\nEj: llamar a Tarik el viernes sobre el rack NIREA, urgente';
}

// Fallback: if Firebase loads after window load
if (window._firestoreFns) window.initFirestore();
</script>

<script>
// ── PWA: Service Worker + Install prompt + Online/Offline ──────────
(function() {
  // Registrar service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          // Si hay una actualización esperando, activarla
          if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                // Nueva versión lista — la próxima recarga la usará
                console.log('SW actualizado, recargá para aplicar.');
              }
            });
          });
        })
        .catch(err => console.warn('SW falló:', err));

      // Auto-reload cuando cambia el controller (nueva versión activa)
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        // No recargo automáticamente para no perder borradores; sólo log.
      });
    });
  }

  // Capturar evento de instalación (Chrome / Edge / Android)
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'inline-block';
  });

  window.installApp = async function() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'none';
    console.log('Instalación:', outcome);
  };

  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'none';
    deferredPrompt = null;
  });

  // Indicador online/offline en vivo
  function updateOnlineStatus() {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    if (!navigator.onLine) {
      el.textContent = '● Offline (datos locales)';
      el.style.color = '#b15c00';
    } else {
      el.textContent = '● Sincronizado';
      el.style.color = '#3b6d11';
    }
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  // Estado inicial al cargar
  window.addEventListener('load', () => setTimeout(updateOnlineStatus, 500));
})();
</script>
